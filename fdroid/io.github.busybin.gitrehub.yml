# Metadata for the F-Droid main repository. Copy this file to
# fdroiddata's metadata/io.github.busybin.gitrehub.yml. IzzyOnDroid
# (developer-signed APKs) is the faster channel; see fdroid/README.md.

Categories:
  - Code & Forge
  - Internet
License: GPL-3.0-only
AuthorName: busybin
SourceCode: https://github.com/busybin/gitrehub
IssueTracker: https://github.com/busybin/gitrehub/issues
Changelog: https://github.com/busybin/gitrehub/releases
AutoName: GitRehub

RepoType: git
Repo: https://github.com/busybin/gitrehub.git

Builds:
  - versionName: '2'
    versionCode: 2
    commit: dd0e52ce8ca53cc1e06c9e281c7f1c7e274b681c
    gradle:
      - yes
    gradleprops:
      - gitrehub.store=fdroid

AutoUpdateMode: Version
UpdateCheckMode: Tags .*[0-9]$
UpdateCheckData: app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"([^"]+)"
CurrentVersion: '2'
CurrentVersionCode: 2

AntiFeatures:
  - NonFreeNet

MaintainerNotes: |-
  Independent GitHub client (GPL-3), Compose only, versionName == versionCode == a plain integer.
  Build: Gradle 9.8.1 (wrapper), AGP 9.4.0, compileSdk 37; `gradle: yes` runs assembleRelease.
  The release key is not in the repo, so the build is unsigned and F-Droid signs it. It never falls
  back to app/keys_debug.jks (a public debug key used only by debug builds).
  `-Pgitrehub.store=fdroid` compiles out the in-app APK updater: a re-signed build would otherwise
  offer an APK that cannot be installed over F-Droid's. Builds signed with the release key check the
  certificate at runtime instead.
  No API keys: the OAuth client id is read from a gitignored properties file, so this build hides the
  device-code login entry; token login works. Update checks are opt-in, so Tracking does not apply.
  Build 2 uses the post-release fix commit (same versionCode); tag 2 predates these build fixes.
