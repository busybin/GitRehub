# Draft for fdroiddata submission. Does not affect the build: copy the whole file to
# fdroiddata's metadata/io.github.busybin.gitrehub.yml and fill in the release info. IzzyOnDroid
# (accepts developer-signed APKs) is an alternative; see fdroid/README.md.

Categories:
  - Code & Forge
  - Internet
License: GPL-3.0-or-later
AuthorName: busybin
WebSite: https://github.com/busybin/gitrehub
SourceCode: https://github.com/busybin/gitrehub
IssueTracker: https://github.com/busybin/gitrehub/issues
Changelog: https://github.com/busybin/gitrehub/releases
AutoName: GitRehub

RepoType: git
Repo: https://github.com/busybin/gitrehub.git

Builds:
  - versionName: '1'
    versionCode: 1
    commit: '1'
    gradle: yes
  - versionName: '2'
    versionCode: 2
    commit: '2'
    gradle: yes

# Releases are self-signed; F-Droid can keep our signature only if reproducible builds are set up,
# otherwise it re-signs and the two channels cannot update over each other.
AllowedAPKSigningKeys: c42c7adc15075ed7349ef5600dd03ddb45177cf82f615534d8309bc0633f53bc

AutoUpdateMode: Version
UpdateCheckMode: Tags .*[0-9]$
UpdateCheckData: app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"([^"]+)"
CurrentVersion: '2'
CurrentVersionCode: 2

# Anti-features:
#  · NonFreeNet — the app's whole purpose is accessing GitHub, a non-free network service.
#  · Tracking does not apply: the update check is off by default and only reads the public
#    releases page when the user opts in, which F-Droid accepts.
AntiFeatures:
  - NonFreeNet

MaintainerNotes: |-
  Independent GitHub client (GPL-3), Compose only, version numbering is a plain integer.
  Build: Gradle 9.8 / AGP 9.4 / built-in Kotlin / compileSdk 37, standard `gradle: yes`.
  The repo ships its own app/keys_debug.jks, used for debug builds only (stable debug signing is
  intentional); release builds do not need it — add scanignore if the scanner flags the "binary".
  The OAuth client id lives in the gitignored app/secrets.properties, so a from-source F-Droid build
  has none: the only effect is that the device-code login entry is hidden, while token login and the
  rest work (README covers usage).
