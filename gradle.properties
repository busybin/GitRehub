# Shared toolchain settings; regenerate rather than hand-edit.
# 4G: the Kotlin compiler snapshots the classpath in memory for incremental builds.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

baseline.compileSdk=37
baseline.targetSdk=36
baseline.minSdk=26
baseline.buildTools=37.0.0

# Jetifier off is the AGP 9 default; AGP 10 removes this switch.
android.enableJetifier=false
